# System packages (.deb, .rpm, .apk, Arch) for Tetro TUI, built by nfpm
# from the same static binary as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64), and
# puts the binary at stage/tetro-tui.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
name: tetro-tui
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/tetro-tui
license: MIT
description: |
  Modern tetromino-stacking game for the terminal.
  Regular, Swift, Classic, Master, Puzzle, Cheese, Survival, Combo and
  custom modes; rotation systems, randomizers, handling timings, ten tile
  palettes, line clear effects, replays and statistics. By Strophox,
  packaged by Asciiverse.
contents:
  - src: stage/tetro-tui
    dst: /usr/bin/tetro-tui
    file_info: { mode: 0755 }
  - src: LICENSE
    dst: /usr/share/doc/tetro-tui/copyright
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/tetro-tui/README.md
    file_info: { mode: 0644 }
  - src: CHANGELOG.md
    dst: /usr/share/doc/tetro-tui/CHANGELOG.md
    file_info: { mode: 0644 }
